<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/assets/favicons/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/assets/favicons/favicon-16x16.png" sizes="16x16">

  <!-- Resolve the theme before the first paint so the page never flashes the
       wrong one. Mirrors the app's ThemeProvider: an 'app-theme' preference of
       system/light/dark, applied as a class on <html>. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("app-theme") || "system";
        var dark = stored === "dark" || (stored === "system" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        /* Private browsing can throw on localStorage; light is a fine default. */
      }
    })();
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3.9.0">
  <link rel="stylesheet" href="/style.css">
</head>
