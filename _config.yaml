title: MapRoulette Docs

sass:
  load_paths:
    - _styles/

collections:
  documentation:
    output: true
  screencasts:
    output: true



# Order of the sidebar sections. Each entry must match a directory name under
# _documentation/.
sections:
  - new-topics
  - basics
  - advanced
  - creating-challenges
  - teams
  - server-admin

defaults:
  - scope: { path: "" } # empty string matches all files in the project
    values:
      layout: "page"

exclude:
  - CODE_OF_CONDUCT.md
  - LICENSE.md
  - README.md
  - mise.toml
