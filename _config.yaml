title: MapRoulette Docs

sass:
  load_paths:
    - _styles/

collections:
  documentation:
    output: true
  screencasts:
    output: true



# Order of the sidebar sections. Each entry must match a directory name under
# _documentation/.
sections:
  - getting-started
  - migrating
  - mapping
  - user-settings
  - projects
  - challenges
  - tasks
  - teams
  - advanced
  - server-admin

# Pages offered in the search box before anything has been typed. Listed by
# slug; the title and section label are looked up from the page itself, so they
# stay correct if a page is retitled or moved.
recommended_pages:
  - discovering-challenges
  - your-dashboard
  - creating-a-challenge
  - using-keyboard-shortcuts
  - teams

defaults:
  - scope: { path: "" } # empty string matches all files in the project
    values:
      layout: "page"

exclude:
  - CODE_OF_CONDUCT.md
  - LICENSE.md
  - README.md
  - SCREENSHOTS-TODO.md
  - mise.toml
